name: Publish Docker

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run the action on"
        default: "main"
        required: true

jobs:
  build_and_publish_platform_containers:
    name: Build and publish platform containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64
        app:
          - name: bytesend
            dockerfile: ./docker/Dockerfile
            context: .
          - name: smtp-proxy
            dockerfile: ./apps/smtp-server/Dockerfile
            context: ./apps/smtp-server

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build the docker image
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          APP: ${{ matrix.app.name }}
          DOCKER_FILE: ${{ matrix.app.dockerfile }}
          CONTEXT: ${{ matrix.app.context }}
        run: |
          GIT_SHA="$(git rev-parse HEAD)"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            REF_TYPE="branch"
            REF_NAME="${{ github.event.inputs.branch }}"
          else
            REF_TYPE="${GITHUB_REF_TYPE}"
            REF_NAME="${GITHUB_REF_NAME}"
          fi

          TAGS="$GIT_SHA"
          APP_VERSION="$GIT_SHA"

          if [ "$REF_TYPE" = "tag" ]; then
            TAGS="$TAGS $REF_NAME latest"
            APP_VERSION="$REF_NAME"
          elif [ "$REF_NAME" = "main" ]; then
            TAGS="$TAGS latest"
            APP_VERSION="latest"
          elif [ "$REF_NAME" = "develop" ]; then
            TAGS="$TAGS develop"
            APP_VERSION="develop"
          fi

          IMAGE_TAG_ARGS=""
          for TAG in $TAGS; do
            IMAGE_TAG_ARGS="$IMAGE_TAG_ARGS -t bytesend/$APP-$BUILD_PLATFORM:$TAG -t ghcr.io/bytesend/$APP-$BUILD_PLATFORM:$TAG"
            # Remove remote tags (single image or manifest list) so re-runs can safely republish.
            docker buildx imagetools rm bytesend/$APP-$BUILD_PLATFORM:$TAG 2>/dev/null || true
            docker buildx imagetools rm ghcr.io/bytesend/$APP-$BUILD_PLATFORM:$TAG 2>/dev/null || true
          done

          docker buildx build \
            -f "$DOCKER_FILE" \
            --platform "linux/$BUILD_PLATFORM" \
            --progress=plain \
            --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg GIT_SHA="$GIT_SHA" \
            $IMAGE_TAG_ARGS \
            --push \
            "$CONTEXT"

  create_and_publish_manifest:
    name: Create and publish manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: build_and_publish_platform_containers
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Create and push DockerHub manifest
        run: |
          GIT_SHA="$(git rev-parse HEAD)"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            REF_TYPE="branch"
            REF_NAME="${{ github.event.inputs.branch }}"
          else
            REF_TYPE="${GITHUB_REF_TYPE}"
            REF_NAME="${GITHUB_REF_NAME}"
          fi

          TAGS="$GIT_SHA"
          if [ "$REF_TYPE" = "tag" ]; then
            TAGS="$TAGS $REF_NAME latest"
          elif [ "$REF_NAME" = "main" ]; then
            TAGS="$TAGS latest"
          elif [ "$REF_NAME" = "develop" ]; then
            TAGS="$TAGS develop"
          fi

          for APP_NAME in bytesend smtp-proxy; do
            for TAG in $TAGS; do
              # Remove remote tags/manifests first so reruns are idempotent.
              docker buildx imagetools rm bytesend/$APP_NAME:$TAG 2>/dev/null || true
              docker buildx imagetools rm bytesend/$APP_NAME-amd64:$TAG 2>/dev/null || true
              docker buildx imagetools rm bytesend/$APP_NAME-arm64:$TAG 2>/dev/null || true
              
              docker manifest create \
                bytesend/$APP_NAME:$TAG \
                --amend bytesend/$APP_NAME-amd64:$TAG \
                --amend bytesend/$APP_NAME-arm64:$TAG

              docker manifest push bytesend/$APP_NAME:$TAG
            done
          done

      - name: Create and push GitHub Container Registry manifest
        run: |
          GIT_SHA="$(git rev-parse HEAD)"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            REF_TYPE="branch"
            REF_NAME="${{ github.event.inputs.branch }}"
          else
            REF_TYPE="${GITHUB_REF_TYPE}"
            REF_NAME="${GITHUB_REF_NAME}"
          fi

          TAGS="$GIT_SHA"
          if [ "$REF_TYPE" = "tag" ]; then
            TAGS="$TAGS $REF_NAME latest"
          elif [ "$REF_NAME" = "main" ]; then
            TAGS="$TAGS latest"
          elif [ "$REF_NAME" = "develop" ]; then
            TAGS="$TAGS develop"
          fi

          for APP_NAME in bytesend smtp-proxy; do
            for TAG in $TAGS; do
              # Remove remote tags/manifests first so reruns are idempotent.
              docker buildx imagetools rm ghcr.io/bytesend/$APP_NAME:$TAG 2>/dev/null || true
              docker buildx imagetools rm ghcr.io/bytesend/$APP_NAME-amd64:$TAG 2>/dev/null || true
              docker buildx imagetools rm ghcr.io/bytesend/$APP_NAME-arm64:$TAG 2>/dev/null || true
              
              docker manifest create \
                ghcr.io/bytesend/$APP_NAME:$TAG \
                --amend ghcr.io/bytesend/$APP_NAME-amd64:$TAG \
                --amend ghcr.io/bytesend/$APP_NAME-arm64:$TAG

              docker manifest push ghcr.io/bytesend/$APP_NAME:$TAG
            done
          done
