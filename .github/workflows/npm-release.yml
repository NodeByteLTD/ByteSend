name: Release Node SDK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
    paths:
      - "packages/sdk/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # 1. Install pnpm FIRST
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      # 2. Set up Node SECOND (Now it can find the pnpm executable for caching)
      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          # Ensure this path is correct relative to the repo root
          cache-dependency-path: pnpm-lock.yaml

      # 3. Only install dependencies required for the SDK
      - name: Install dependencies
        run: pnpm install --filter "./packages/sdk..." --frozen-lockfile

      - name: Publish SDK
        working-directory: packages/sdk
        run: |
          pnpm run build
          npm publish --access public --no-git-checks --provenance
