name: Marketing website issue
description: Report a bug or UX/content issue in the public marketing site.
title: "marketing: "
labels: ["marketing", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a marketing site issue.

  - type: input
    id: page
    attributes:
      label: Affected page URL
      placeholder: https://bytesend.cloud/
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings