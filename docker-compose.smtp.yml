version: '3.8'
services:
  smtp:
    build:
      context: .
      dockerfile: Dockerfile.smtp
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
      - "2465:2465"
      - "2587:2587"
    environment:
      - NODE_ENV=production
      - SMTP_AUTH_USERNAME=bytesend
      - BYTESEND_BASE_URL=https://bytesend.cloud
      - SMTP_TLS_MODE=traefik
    labels:
      - "traefik.enable=true"
      
      # Entrypoint for Submission (587)
      - "traefik.tcp.routers.smtp-587.entrypoints=smtp-submission"
      - "traefik.tcp.routers.smtp-587.rule=HostSNI(`smtp.bytesend.cloud`)"
      - "traefik.tcp.routers.smtp-587.tls=true"
      - "traefik.tcp.routers.smtp-587.tls.certresolver=letsencrypt"
      
      # Entrypoint for SMTPS (465)
      - "traefik.tcp.routers.smtp-465.entrypoints=smtps"
      - "traefik.tcp.routers.smtp-465.rule=HostSNI(`smtp.bytesend.cloud`)"
      - "traefik.tcp.routers.smtp-465.tls=true"
      - "traefik.tcp.routers.smtp-465.tls.certresolver=letsencrypt"

      # Point both to the same internal port (587)
      - "traefik.tcp.routers.smtp-587.service=smtp-svc"
      - "traefik.tcp.routers.smtp-465.service=smtp-svc"
      - "traefik.tcp.services.smtp-svc.loadbalancer.server.port=587"
