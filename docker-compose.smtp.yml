version: '3.8'
services:
  smtp:
    build:
      context: .
      dockerfile: Dockerfile.smtp
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
      - "2465:2465"
      - "2587:2587"
    environment:
      - NODE_ENV=production
      - SMTP_AUTH_USERNAME=bytesend
      - BYTESEND_BASE_URL=https://bytesend.cloud
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.smtp.rule=HostSNI(`smtp.bytesend.cloud`)"
      - "traefik.tcp.routers.smtp.entrypoints=smtp"
      - "traefik.tcp.routers.smtp.service=smtp"
      - "traefik.tcp.services.smtp.loadbalancer.server.port=587"